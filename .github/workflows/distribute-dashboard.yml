name: Desktop Dashboard distribution
run-name: Dashboard mirror v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Desktop Dashboard stable version
        required: true
        type: string
      apply:
        description: Upload verified packages and keep only the newest three versions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-dashboard-oss-distribution
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'Earthling18/claude-code-launcher'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Earthling18/desktop-dashboard-releases
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release retention boundaries
        run: python -m unittest discover -s tests -p test_release_support.py -v
      - name: Install OSS SDK
        run: python -m pip install --disable-pip-version-check oss2==2.19.1
      - name: Mirror only the Desktop Dashboard namespace
        env:
          GH_TOKEN: ${{ github.token }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          DASHBOARD_VERSION: ${{ inputs.version }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--version "$DASHBOARD_VERSION")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python scripts/mirror-release.py "${args[@]}"
