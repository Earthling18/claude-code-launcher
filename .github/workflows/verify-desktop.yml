name: Verify desktop candidate
on:
  workflow_dispatch:
    inputs:
      windows_artifact_run:
        description: 'Re-test UI: completed candidate run ID, or release:v1.3.1 (no rebuild)'
        type: string
        default: ''
  push:
    branches: ['release/1.3.1']
    paths-ignore:
      - '**/*.md'
      - 'scripts/package-python.py'
      - 'scripts/test_windows_navigation.py'
      - '.github/workflows/verify-desktop.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: ${{ inputs.windows_artifact_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install cryptography==46.0.7 PyYAML==6.0.3
      - run: python -m unittest discover -s python-connection/tests -v
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-wt.ps1 -Version '1.24.11321.0' -Sha256 '7CAEF554147E5498ED1BECDCA73CDEDB79FBC81F89032E46AE9B095C53433812'
          npm run tauri build -- --no-bundle
      - name: Native Windows UI regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE/.cargo/bin/msedgedriver-tool.exe"
          python scripts/test_windows_navigation.py
      - name: Build Mac candidate
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ runner.os }}
          path: |
            qa-artifacts/
            src-tauri/target/release/cc-launcher-tauri.exe
            src-tauri/target/release/bundle/macos/*.app
  native-windows-recheck:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_artifact_run != '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(inputs.windows_artifact_run, 'release:') }}
        with:
          name: candidate-Windows
          run-id: ${{ inputs.windows_artifact_run }}
          github-token: ${{ github.token }}
      - name: Download released Windows package
        if: ${{ startsWith(inputs.windows_artifact_run, 'release:') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CCL_RELEASE_SOURCE: ${{ inputs.windows_artifact_run }}
        run: |
          $tag = $env:CCL_RELEASE_SOURCE.Substring(8)
          gh release download $tag --pattern '*_portable.zip' --dir qa-download
          Expand-Archive (Get-ChildItem qa-download/*_portable.zip).FullName qa-download/unpacked
          $exe = Get-ChildItem qa-download/unpacked -Recurse -Filter 'CC 启动器.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/target/release | Out-Null
          Copy-Item $exe.FullName src-tauri/target/release/cc-launcher-tauri.exe
          if (Test-Path (Join-Path $exe.DirectoryName 'resources')) {
            Copy-Item -Recurse (Join-Path $exe.DirectoryName 'resources') src-tauri/target/release/resources
          }
      - name: Native Windows UI regression
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE/.cargo/bin/msedgedriver-tool.exe"
          python scripts/test_windows_navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-proof
          path: qa-artifacts/
