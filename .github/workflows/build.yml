name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Fires when a GitHub Release is published as NON-prerelease (i.e. you
  # un-check "pre-release" / click "Set as latest release"). This is the
  # all-users update switch: it (re)generates the OSS latest.json so the
  # Tauri updater starts offering this version. Pushing a tag alone only
  # mirrors the installers + lists the version — it never pushes to users.
  release:
    types: [released]
  workflow_dispatch:

jobs:
  check-version:
    # Build chain runs for tag pushes / manual dispatch only. The `released`
    # event takes the lightweight publish-to-OSS path (promote-to-oss) instead,
    # reusing the already-built installers — no rebuild.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          TAURI_VER=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)
          CARGO_VER=$(grep -oP '^version\s*=\s*"\K[^"]+' src-tauri/Cargo.toml)
          PKG_VER=$(grep -oP '"version":\s*"\K[^"]+' package.json | head -1)
          echo "tauri.conf.json: $TAURI_VER"
          echo "Cargo.toml:      $CARGO_VER"
          echo "package.json:    $PKG_VER"
          if [ "$TAURI_VER" != "$CARGO_VER" ] || [ "$TAURI_VER" != "$PKG_VER" ]; then
            echo "::error::Version mismatch! All three files must have the same version."
            exit 1
          fi
          echo "All versions match: $TAURI_VER"

  build-windows:
    needs: check-version
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Windows Terminal Portable, bundled as the fallback terminal when the
      # user's system has no wt.exe (avoids conhost rendering issues).
      WT_VERSION: '1.24.11321.0'
      WT_ZIP_SHA256: '7CAEF554147E5498ED1BECDCA73CDEDB79FBC81F89032E46AE9B095C53433812'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Fetch Windows Terminal Portable
        shell: pwsh
        run: ./scripts/fetch-wt.ps1 -Version $env:WT_VERSION -Sha256 $env:WT_ZIP_SHA256
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CC 启动器 ${{ github.ref_name }}'
          # Publish as a pre-release, not a draft. You self-test from this
          # pre-release (installers are also mirrored to OSS), then un-check
          # "pre-release" on GitHub to promote it to latest — that fires the
          # release:released event and pushes the update to all users.
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $portableDir

          # Copy the built exe
          Copy-Item "src-tauri/target/release/cc-launcher-tauri.exe" "$portableDir/CC 启动器.exe"

          # Bundled resources (Windows Terminal portable fallback). tauri-build
          # mirrors src-tauri/resources into target/release/resources; fall back
          # to the source dir if the layout ever changes.
          if (Test-Path "src-tauri/target/release/resources/wt/WindowsTerminal.exe") {
            Copy-Item -Recurse "src-tauri/target/release/resources" "$portableDir/resources"
          } else {
            New-Item -ItemType Directory -Force -Path "$portableDir/resources" | Out-Null
            Copy-Item -Recurse "src-tauri/resources/wt" "$portableDir/resources/wt"
          }

          # Create .portable marker
          New-Item -ItemType File -Path "$portableDir/.portable" -Value "CC 启动器 Portable v$version"

          # Create zip
          $zipName = "CC-Launcher_${version}_x64_portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName -Force
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable zip to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE_ZIP }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: check-version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri app (Universal Binary)
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CC 启动器 ${{ github.ref_name }}'
          # See windows job: pre-release on tag push, promote later to push.
          releaseDraft: false
          prerelease: true
          args: --target universal-apple-darwin

  # Tauri sanitizes the productName "CC 启动器" into "CC." for bundle filenames,
  # producing assets like `CC._1.1.1_x64-setup.exe`. We rename them to a clean
  # ASCII prefix `CCLauncher_` AFTER both build jobs upload, and patch `latest.json`
  # so the Tauri updater can still resolve the new URLs.
  rename-assets:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename release assets to ASCII names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          WORK=$(mktemp -d)
          echo -n "" > "$WORK/renames.txt"

          # Cache asset list once (avoid hitting the API per pattern).
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' > "$WORK/assets.txt"

          rename_asset() {
            local pattern="$1"   # bash extended regex
            local new_name="$2"
            local old_name
            old_name=$(grep -E "$pattern" "$WORK/assets.txt" | head -1 || true)
            if [ -z "$old_name" ]; then
              echo "[skip] no asset matching: $pattern"
              return
            fi
            if [ "$old_name" = "$new_name" ]; then
              echo "[skip] $old_name already named correctly"
              return
            fi
            echo "Rename: $old_name -> $new_name"
            gh release download "$TAG" -R "$REPO" --pattern "$old_name" --dir "$WORK" --clobber
            mv "$WORK/$old_name" "$WORK/$new_name"
            gh release upload "$TAG" -R "$REPO" "$WORK/$new_name" --clobber
            gh release delete-asset "$TAG" -R "$REPO" "$old_name" -y
            rm -f "$WORK/$new_name"
            printf '%s|%s\n' "$old_name" "$new_name" >> "$WORK/renames.txt"
          }

          # VER_ESC: dots escaped for use in regex (1.1.1 -> 1\.1\.1)
          VER_ESC="${VERSION//./\\.}"

          rename_asset "^CC.*_${VER_ESC}_x64-setup\\.exe$"             "CCLauncher_${VERSION}_x64-setup.exe"
          rename_asset "^CC.*_${VER_ESC}_x64-setup\\.exe\\.sig$"       "CCLauncher_${VERSION}_x64-setup.exe.sig"
          rename_asset "^CC.*_${VER_ESC}_universal\\.dmg$"             "CCLauncher_${VERSION}_universal.dmg"
          rename_asset "^CC.*_universal\\.app\\.tar\\.gz$"             "CCLauncher_${VERSION}_universal.app.tar.gz"
          rename_asset "^CC.*_universal\\.app\\.tar\\.gz\\.sig$"       "CCLauncher_${VERSION}_universal.app.tar.gz.sig"

          # tauri-action never uploads latest.json for us: the non-ASCII
          # productName ("CC 启动器") breaks its signature lookup and it logs
          # "Signature not found for the updater JSON. Skipping upload...".
          # Build latest.json ourselves from the renamed assets + .sig files.
          echo "Generating latest.json..."
          WIN_SIG_FILE="CCLauncher_${VERSION}_x64-setup.exe.sig"
          MAC_SIG_FILE="CCLauncher_${VERSION}_universal.app.tar.gz.sig"
          gh release download "$TAG" -R "$REPO" --pattern '*.sig' --dir "$WORK" --clobber
          if [ -f "$WORK/$WIN_SIG_FILE" ] && [ -f "$WORK/$MAC_SIG_FILE" ]; then
            BASE="https://github.com/${REPO}/releases/download/${TAG}"
            jq -n \
              --arg version "$VERSION" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg win_url "$BASE/CCLauncher_${VERSION}_x64-setup.exe" \
              --arg win_sig "$(cat "$WORK/$WIN_SIG_FILE")" \
              --arg mac_url "$BASE/CCLauncher_${VERSION}_universal.app.tar.gz" \
              --arg mac_sig "$(cat "$WORK/$MAC_SIG_FILE")" \
              '{version: $version, notes: "", pub_date: $pub_date, platforms: {
                 "windows-x86_64": {signature: $win_sig, url: $win_url},
                 "darwin-x86_64":  {signature: $mac_sig, url: $mac_url},
                 "darwin-aarch64": {signature: $mac_sig, url: $mac_url}
               }}' > "$WORK/latest.json"
            gh release upload "$TAG" -R "$REPO" "$WORK/latest.json" --clobber
            echo "latest.json uploaded."
          else
            echo "::warning::Missing .sig assets; latest.json not generated (updater will not see this release)."
          fi

          rm -rf "$WORK"
          echo "Done."

      # ----------------------------------------------------------------------
      # Mirror the release to Aliyun OSS for users in mainland China, who often
      # cannot reach github.com / objects.githubusercontent.com without a VPN.
      #
      # GitHub Releases stays the primary channel — this step is best-effort
      # (continue-on-error) so an OSS hiccup never fails the release. It:
      #   1. uploads every renamed installer to releases/v{version}/
      #   2. writes releases/latest.json (same content as the GitHub one, but
      #      every platform url rewritten to its OSS address; signatures kept
      #      verbatim so the Tauri minisign check still passes)
      #   3. maintains releases/releases.json — a version index the in-app
      #      "available versions" panel reads (keeps only the latest 5, since
      #      the UI shows at most 5).
      #
      # Skips silently (with a ::warning::) if the OSS secrets are not set, so
      # forks without OSS configured still build cleanly.
      # ----------------------------------------------------------------------
      - name: Mirror release to Aliyun OSS
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"

          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ] || [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::warning::OSS secrets not configured; skipping OSS mirror."
            exit 0
          fi

          # OSS_ENDPOINT is a host like oss-cn-shanghai.aliyuncs.com; derive the
          # region (cn-shanghai) and the public base URL for download links.
          REGION="$(echo "$OSS_ENDPOINT" | sed -E 's/^oss-([a-z0-9-]+)\.aliyuncs\.com$/\1/')"
          # Public object base. If OSS_CDN_DOMAIN is set we prefer it (CDN in
          # front of the bucket); otherwise the virtual-hosted bucket endpoint.
          if [ -n "${OSS_CDN_DOMAIN:-}" ]; then
            PUBLIC_BASE="https://${OSS_CDN_DOMAIN}"
          else
            PUBLIC_BASE="https://${OSS_BUCKET}.${OSS_ENDPOINT}"
          fi
          echo "OSS region=$REGION public_base=$PUBLIC_BASE"

          # Install ossutil v2 (linux amd64 runner).
          OSSUTIL_VER="2.1.1"
          curl -sSL -o /tmp/ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VER}/ossutil-${OSSUTIL_VER}-linux-amd64.zip"
          unzip -o -q /tmp/ossutil.zip -d /tmp/ossutil-dist
          OSSUTIL="$(find /tmp/ossutil-dist -maxdepth 2 -name ossutil -type f | head -1)"
          chmod +x "$OSSUTIL"
          export OSS_REGION="$REGION"
          "$OSSUTIL" version | head -1

          WORK="$(mktemp -d)"

          # The four user-facing artifacts (ASCII names produced by rename step).
          WIN_EXE="CCLauncher_${VERSION}_x64-setup.exe"
          MAC_TAR="CCLauncher_${VERSION}_universal.app.tar.gz"
          MAC_DMG="CCLauncher_${VERSION}_universal.dmg"
          PORTABLE="CC-Launcher_${VERSION}_x64_portable.zip"

          # 1) Download every relevant asset + the .sig files, push installers
          #    to releases/v{version}/.
          for f in "$WIN_EXE" "$MAC_TAR" "$MAC_DMG" "$PORTABLE" "${WIN_EXE}.sig" "${MAC_TAR}.sig"; do
            if gh release download "$TAG" -R "$REPO" --pattern "$f" --dir "$WORK" --clobber 2>/dev/null; then
              echo "downloaded $f"
            else
              echo "::warning::asset not found, skipping: $f"
            fi
          done

          for f in "$WIN_EXE" "$MAC_TAR" "$MAC_DMG" "$PORTABLE"; do
            if [ -f "$WORK/$f" ]; then
              "$OSSUTIL" cp "$WORK/$f" "oss://${OSS_BUCKET}/releases/v${VERSION}/$f" --force
            fi
          done

          # NOTE: OSS latest.json (the all-users update trigger) is deliberately
          # NOT written here. A tag push publishes a PRE-release for self-test;
          # pushing latest.json now would notify everyone prematurely. It is
          # written by the promote-to-oss job when you un-pre-release on GitHub.
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 2) releases.json — version index for the in-app version list.
          #    Fetch existing (ignore 404), drop any existing entry for this
          #    version, prepend the new one, keep newest 5.
          RELEASE_NOTES="$(gh release view "$TAG" -R "$REPO" --json body --jq '.body' 2>/dev/null || echo "")"
          IS_PRERELEASE="$(gh release view "$TAG" -R "$REPO" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo false)"
          OSS_VER_BASE="${PUBLIC_BASE}/releases/v${VERSION}"

          NEW_ENTRY="$(jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "$RELEASE_NOTES" \
            --argjson prerelease "$IS_PRERELEASE" \
            --arg win "${OSS_VER_BASE}/${WIN_EXE}" \
            --arg mac_dmg "${OSS_VER_BASE}/${MAC_DMG}" \
            --arg mac_tar "${OSS_VER_BASE}/${MAC_TAR}" \
            --arg portable "${OSS_VER_BASE}/${PORTABLE}" \
            '{version: $version, pub_date: $pub_date, notes: $notes, prerelease: $prerelease,
              platforms: {
                "windows-x86_64": {url: $win},
                "darwin-universal-dmg": {url: $mac_dmg},
                "darwin-universal-tar": {url: $mac_tar},
                "windows-portable": {url: $portable}
              }}')"

          EXISTING="[]"
          if curl -fsSL "${PUBLIC_BASE}/releases/releases.json" -o "$WORK/releases.json" 2>/dev/null; then
            if jq empty "$WORK/releases.json" 2>/dev/null; then
              EXISTING="$(cat "$WORK/releases.json")"
            fi
          fi

          echo "$EXISTING" | jq \
            --argjson entry "$NEW_ENTRY" \
            '[ $entry ] + ( map(select(.version != $entry.version)) ) | .[0:5]' \
            > "$WORK/releases.new.json"
          "$OSSUTIL" cp "$WORK/releases.new.json" "oss://${OSS_BUCKET}/releases/releases.json" --force
          echo "OSS releases.json updated (kept newest 5)."

          rm -rf "$WORK"
          echo "OSS mirror done."

  # ========================================================================
  # promote-to-oss — the all-users update switch.
  #
  # Runs ONLY on the release:released event, which GitHub fires when a release
  # is published as non-prerelease (you un-check "pre-release" / "Set as latest
  # release" on an existing pre-release). It does NOT rebuild — the installers
  # were already built + mirrored at tag time. It just:
  #   1. (re)generates OSS releases/latest.json from the release's .sig files,
  #      with urls pointing at OSS — this is what the Tauri updater reads, so
  #      this is the moment all users start getting the update.
  #   2. flips this version's prerelease flag to false in releases/releases.json
  #      so the in-app list drops the "Pre" badge.
  #
  # Best-effort (continue-on-error): GitHub stays the source of truth.
  # ========================================================================
  promote-to-oss:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Promote release to OSS latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_CDN_DOMAIN: ${{ secrets.OSS_CDN_DOMAIN }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"

          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ] || [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::warning::OSS secrets not configured; skipping OSS promote."
            exit 0
          fi

          REGION="$(echo "$OSS_ENDPOINT" | sed -E 's/^oss-([a-z0-9-]+)\.aliyuncs\.com$/\1/')"
          if [ -n "${OSS_CDN_DOMAIN:-}" ]; then
            PUBLIC_BASE="https://${OSS_CDN_DOMAIN}"
          else
            PUBLIC_BASE="https://${OSS_BUCKET}.${OSS_ENDPOINT}"
          fi

          OSSUTIL_VER="2.1.1"
          curl -sSL -o /tmp/ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VER}/ossutil-${OSSUTIL_VER}-linux-amd64.zip"
          unzip -o -q /tmp/ossutil.zip -d /tmp/ossutil-dist
          OSSUTIL="$(find /tmp/ossutil-dist -maxdepth 2 -name ossutil -type f | head -1)"
          chmod +x "$OSSUTIL"
          export OSS_REGION="$REGION"

          WORK="$(mktemp -d)"
          WIN_EXE="CCLauncher_${VERSION}_x64-setup.exe"
          MAC_TAR="CCLauncher_${VERSION}_universal.app.tar.gz"
          MAC_DMG="CCLauncher_${VERSION}_universal.dmg"
          PORTABLE="CC-Launcher_${VERSION}_x64_portable.zip"
          OSS_VER_BASE="${PUBLIC_BASE}/releases/v${VERSION}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 1) Build OSS latest.json from the release's .sig files (signatures
          #    verbatim — minisign verification must still pass). This is the
          #    all-users trigger.
          gh release download "$TAG" -R "$REPO" --pattern "${WIN_EXE}.sig" --dir "$WORK" --clobber 2>/dev/null || true
          gh release download "$TAG" -R "$REPO" --pattern "${MAC_TAR}.sig" --dir "$WORK" --clobber 2>/dev/null || true
          if [ -f "$WORK/${WIN_EXE}.sig" ] && [ -f "$WORK/${MAC_TAR}.sig" ]; then
            jq -n \
              --arg version "$VERSION" \
              --arg pub_date "$PUB_DATE" \
              --arg win_url "${OSS_VER_BASE}/${WIN_EXE}" \
              --arg win_sig "$(cat "$WORK/${WIN_EXE}.sig")" \
              --arg mac_url "${OSS_VER_BASE}/${MAC_TAR}" \
              --arg mac_sig "$(cat "$WORK/${MAC_TAR}.sig")" \
              '{version: $version, notes: "", pub_date: $pub_date, platforms: {
                 "windows-x86_64": {signature: $win_sig, url: $win_url},
                 "darwin-x86_64":  {signature: $mac_sig, url: $mac_url},
                 "darwin-aarch64": {signature: $mac_sig, url: $mac_url}
               }}' > "$WORK/latest.json"
            "$OSSUTIL" cp "$WORK/latest.json" "oss://${OSS_BUCKET}/releases/latest.json" --force
            echo "OSS latest.json promoted to v${VERSION} — update is now live for all users."
          else
            echo "::warning::Missing .sig assets for $TAG; OSS latest.json NOT promoted (was this version mirrored at tag time?)."
          fi

          # 2) Clear the "Pre" badge for this version in releases.json (best
          #    effort — if the version isn't present yet it's left untouched).
          if curl -fsSL "${PUBLIC_BASE}/releases/releases.json" -o "$WORK/releases.json" 2>/dev/null && jq empty "$WORK/releases.json" 2>/dev/null; then
            jq --arg v "$VERSION" \
              'map(if .version == $v then .prerelease = false else . end)' \
              "$WORK/releases.json" > "$WORK/releases.new.json"
            "$OSSUTIL" cp "$WORK/releases.new.json" "oss://${OSS_BUCKET}/releases/releases.json" --force
            echo "releases.json: cleared prerelease flag for v${VERSION}."
          fi

          rm -rf "$WORK"
          echo "Promote done."
