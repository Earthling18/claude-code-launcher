name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          TAURI_VER=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)
          CARGO_VER=$(grep -oP '^version\s*=\s*"\K[^"]+' src-tauri/Cargo.toml)
          PKG_VER=$(grep -oP '"version":\s*"\K[^"]+' package.json | head -1)
          echo "tauri.conf.json: $TAURI_VER"
          echo "Cargo.toml:      $CARGO_VER"
          echo "package.json:    $PKG_VER"
          if [ "$TAURI_VER" != "$CARGO_VER" ] || [ "$TAURI_VER" != "$PKG_VER" ]; then
            echo "::error::Version mismatch! All three files must have the same version."
            exit 1
          fi
          echo "All versions match: $TAURI_VER"

  build-windows:
    needs: check-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CC 启动器 ${{ github.ref_name }}'
          releaseDraft: true
          updaterJsonPreferNsis: true

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $portableDir

          # Copy the built exe
          Copy-Item "src-tauri/target/release/cc-launcher-tauri.exe" "$portableDir/CC 启动器.exe"

          # Create .portable marker
          New-Item -ItemType File -Path "$portableDir/.portable" -Value "CC 启动器 Portable v$version"

          # Create zip
          $zipName = "CC-Launcher_${version}_x64_portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName -Force
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable zip to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE_ZIP }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: check-version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri app (Universal Binary)
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CC 启动器 ${{ github.ref_name }}'
          releaseDraft: true
          args: --target universal-apple-darwin

  # Tauri sanitizes the productName "CC 启动器" into "CC." for bundle filenames,
  # producing assets like `CC._1.1.1_x64-setup.exe`. We rename them to a clean
  # ASCII prefix `CCLauncher_` AFTER both build jobs upload, and patch `latest.json`
  # so the Tauri updater can still resolve the new URLs.
  rename-assets:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename release assets to ASCII names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          WORK=$(mktemp -d)
          echo -n "" > "$WORK/renames.txt"

          # Cache asset list once (avoid hitting the API per pattern).
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' > "$WORK/assets.txt"

          rename_asset() {
            local pattern="$1"   # bash extended regex
            local new_name="$2"
            local old_name
            old_name=$(grep -E "$pattern" "$WORK/assets.txt" | head -1 || true)
            if [ -z "$old_name" ]; then
              echo "[skip] no asset matching: $pattern"
              return
            fi
            if [ "$old_name" = "$new_name" ]; then
              echo "[skip] $old_name already named correctly"
              return
            fi
            echo "Rename: $old_name -> $new_name"
            gh release download "$TAG" -R "$REPO" --pattern "$old_name" --dir "$WORK" --clobber
            mv "$WORK/$old_name" "$WORK/$new_name"
            gh release upload "$TAG" -R "$REPO" "$WORK/$new_name" --clobber
            gh release delete-asset "$TAG" -R "$REPO" "$old_name" -y
            rm -f "$WORK/$new_name"
            printf '%s|%s\n' "$old_name" "$new_name" >> "$WORK/renames.txt"
          }

          # VER_ESC: dots escaped for use in regex (1.1.1 -> 1\.1\.1)
          VER_ESC="${VERSION//./\\.}"

          rename_asset "^CC.*_${VER_ESC}_x64-setup\\.exe$"             "CCLauncher_${VERSION}_x64-setup.exe"
          rename_asset "^CC.*_${VER_ESC}_x64-setup\\.exe\\.sig$"       "CCLauncher_${VERSION}_x64-setup.exe.sig"
          rename_asset "^CC.*_${VER_ESC}_universal\\.dmg$"             "CCLauncher_${VERSION}_universal.dmg"
          rename_asset "^CC.*_universal\\.app\\.tar\\.gz$"             "CCLauncher_${VERSION}_universal.app.tar.gz"
          rename_asset "^CC.*_universal\\.app\\.tar\\.gz\\.sig$"       "CCLauncher_${VERSION}_universal.app.tar.gz.sig"

          # Update latest.json so Tauri updater resolves the new URLs.
          if grep -qFx 'latest.json' "$WORK/assets.txt"; then
            if [ -s "$WORK/renames.txt" ]; then
              echo "Patching latest.json URLs..."
              gh release download "$TAG" -R "$REPO" --pattern 'latest.json' --dir "$WORK" --clobber
              while IFS='|' read -r old_n new_n; do
                [ -z "$old_n" ] && continue
                # Escape regex/sed-special chars in filenames (dots etc.)
                old_esc=$(printf '%s' "$old_n" | sed 's/[][\\.*^$/]/\\&/g')
                new_esc=$(printf '%s' "$new_n" | sed 's/[\\&/]/\\&/g')
                sed -i "s|/$old_esc|/$new_esc|g" "$WORK/latest.json"
              done < "$WORK/renames.txt"
              gh release upload "$TAG" -R "$REPO" "$WORK/latest.json" --clobber
              echo "latest.json updated."
            fi
          fi

          rm -rf "$WORK"
          echo "Done."
