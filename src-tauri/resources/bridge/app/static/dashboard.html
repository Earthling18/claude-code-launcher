<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobotAgent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F8F9FB;
  --surface: #FFFFFF;
  --surface2: #F3F4F6;
  --border: #E5E7EB;
  --text: #1A1D26;
  --text2: #6B7280;
  --accent: #2B7DE9;
  --accent2: #5B9EF0;
  --green: #16A34A;
  --amber: #D97706;
  --red: #DC2626;
  --cyan: #2B7DE9;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}
.header-meta {
  font-size: 13px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 12px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.container { padding: 24px 32px 32px; }

/* Cards Grid */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: border-color .2s;
}
.card:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(43,125,233,.1); }
.card-label {
  font-size: 12px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  font-weight: 500;
}
.card-value {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
}
.card-sub {
  font-size: 12px;
  color: var(--text2);
  margin-top: 6px;
}
.card-sub span { color: var(--accent2); font-weight: 500; }

/* Charts Grid */
.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.chart-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}
.chart-box h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
}
.chart-box canvas { width: 100% !important; }

/* Recent Table */
.table-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  overflow-x: auto;
}
.table-box h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  padding: 10px 12px;
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  white-space: nowrap;
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.badge-ok { background: #F0FDF4; color: var(--green); }
.badge-err { background: #FEF2F2; color: var(--red); }
.badge-run { background: #FFFBEB; color: var(--amber); }

.empty { text-align:center; padding:40px; color:var(--text2); }

@media (max-width: 900px) {
  .charts { grid-template-columns: 1fr; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .container { padding: 0 16px 16px; }
  .header { padding: 0 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>MobotAgent Dashboard</h1>
  <div class="header-meta">
    <span class="status-dot"></span>
    <span id="updateTime">loading...</span>
  </div>
</div>

<div class="container">
  <!-- Overview Cards -->
  <div class="cards" id="cards"></div>

  <!-- Charts -->
  <div class="charts">
    <div class="chart-box">
      <h3>Requests & Tokens (7 days)</h3>
      <canvas id="trendChart" height="220"></canvas>
    </div>
    <div class="chart-box">
      <h3>Top Users (7 days)</h3>
      <canvas id="usersChart" height="220"></canvas>
    </div>
    <div class="chart-box">
      <h3>Skills Usage (7 days)</h3>
      <canvas id="skillsChart" height="220"></canvas>
    </div>
    <div class="chart-box">
      <h3>Hourly Distribution (7 days)</h3>
      <canvas id="hourlyChart" height="220"></canvas>
    </div>
  </div>

  <!-- Recent Requests -->
  <div class="table-box">
    <h3>Recent Requests</h3>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>User</th>
          <th>Query</th>
          <th>Tokens</th>
          <th>Cost</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="recentBody"></tbody>
    </table>
  </div>
</div>

<script>
const BASE = '/api/v1/metrics';
const COLORS = {
  accent: '#2B7DE9',
  accent2: '#5B9EF0',
  cyan: '#2B7DE9',
  green: '#16A34A',
  amber: '#D97706',
  text2: '#6B7280',
  border: '#E5E7EB',
};
const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { labels: { color: COLORS.text2, font: { size: 11 } } } },
  scales: {
    x: { ticks: { color: COLORS.text2, font: { size: 10 } }, grid: { color: '#F3F4F6' } },
    y: { ticks: { color: COLORS.text2, font: { size: 10 } }, grid: { color: '#F3F4F6' } },
  },
};

let trendChart, usersChart, skillsChart, hourlyChart;

function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return String(n);
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function fmtDuration(ms) {
  if (!ms) return '-';
  if (ms < 1000) return ms + 'ms';
  return (ms/1000).toFixed(1) + 's';
}

function renderCards(data) {
  const t = data.today, w = data.week;
  const items = [
    { label: 'Sessions', value: t.sessions, week: w.sessions, color: COLORS.accent },
    { label: 'Requests', value: t.requests, week: w.requests, color: COLORS.accent },
    { label: 'Tokens', value: fmtNum(t.input_tokens + t.output_tokens), week: fmtNum(w.input_tokens + w.output_tokens), color: COLORS.green },
    { label: 'Skill Calls', value: t.skills, week: w.skills, color: COLORS.green },
  ];
  document.getElementById('cards').innerHTML = items.map(c =>
    `<div class="card">
      <div class="card-label">${c.label}</div>
      <div class="card-value" style="color:${c.color}">${c.value}</div>
      <div class="card-sub">7d: <span>${c.week}</span></div>
    </div>`
  ).join('');
}

function initCharts() {
  const ctx1 = document.getElementById('trendChart').getContext('2d');
  trendChart = new Chart(ctx1, {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'Requests', data: [], borderColor: COLORS.accent, backgroundColor: COLORS.accent+'33', fill: true, tension: .3, yAxisID: 'y' },
      { label: 'Tokens', data: [], borderColor: '#93C5FD', backgroundColor: '#93C5FD33', fill: true, tension: .3, yAxisID: 'y1' },
    ]},
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: { ...chartDefaults.scales.y, position: 'left', title: { display: true, text: 'Requests', color: COLORS.text2 } },
        y1: { ...chartDefaults.scales.y, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Tokens', color: COLORS.text2 } },
      },
    },
  });

  const ctx2 = document.getElementById('usersChart').getContext('2d');
  usersChart = new Chart(ctx2, {
    type: 'bar',
    data: { labels: [], datasets: [{ label: 'Requests', data: [], backgroundColor: COLORS.accent2 }] },
    options: { ...chartDefaults, indexAxis: 'y' },
  });

  const ctx3 = document.getElementById('skillsChart').getContext('2d');
  skillsChart = new Chart(ctx3, {
    type: 'bar',
    data: { labels: [], datasets: [{ label: 'Calls', data: [], backgroundColor: COLORS.cyan }] },
    options: { ...chartDefaults, indexAxis: 'y' },
  });

  const ctx4 = document.getElementById('hourlyChart').getContext('2d');
  hourlyChart = new Chart(ctx4, {
    type: 'bar',
    data: { labels: [], datasets: [{ label: 'Requests', data: [], backgroundColor: COLORS.accent+'99' }] },
    options: chartDefaults,
  });
}

function updateTrend(data) {
  trendChart.data.labels = data.map(d => d.date.slice(5));
  trendChart.data.datasets[0].data = data.map(d => d.requests);
  trendChart.data.datasets[1].data = data.map(d => d.input_tokens + d.output_tokens);
  trendChart.update();
}

function updateUsers(data) {
  usersChart.data.labels = data.map(d => d.user_name || d.user_id.slice(0,12));
  usersChart.data.datasets[0].data = data.map(d => d.requests);
  usersChart.update();
}

function updateSkills(data) {
  if (!data.length) {
    skillsChart.data.labels = ['No data'];
    skillsChart.data.datasets[0].data = [0];
  } else {
    skillsChart.data.labels = data.map(d => d.skill_name);
    skillsChart.data.datasets[0].data = data.map(d => d.count);
  }
  skillsChart.update();
}

function updateHourly(data) {
  hourlyChart.data.labels = data.map(d => d.hour + ':00');
  hourlyChart.data.datasets[0].data = data.map(d => d.count);
  hourlyChart.update();
}

function renderRecent(data) {
  const body = document.getElementById('recentBody');
  if (!data.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">No requests yet</td></tr>';
    return;
  }
  body.innerHTML = data.map(r => {
    const badge = r.status === 'completed' ? 'badge-ok'
      : r.status === 'error' ? 'badge-err' : 'badge-run';
    return `<tr>
      <td>${fmtTime(r.timestamp)}</td>
      <td>${r.user_name || r.user_id.slice(0,12)}</td>
      <td title="${(r.query_text||'').replace(/"/g,'&quot;')}">${(r.query_text||'').slice(0,60)}</td>
      <td>${fmtNum(r.input_tokens)}/${fmtNum(r.output_tokens)}</td>
      <td>$${(r.cost_usd||0).toFixed(3)}</td>
      <td>${fmtDuration(r.duration_ms)}</td>
      <td><span class="badge ${badge}">${r.status}</span></td>
    </tr>`;
  }).join('');
}

async function fetchJSON(path) {
  try {
    const r = await fetch(BASE + path);
    return await r.json();
  } catch { return null; }
}

async function refresh() {
  const [overview, timeline, users, skills, hourly, recent] = await Promise.all([
    fetchJSON('/overview'),
    fetchJSON('/timeline'),
    fetchJSON('/users/top'),
    fetchJSON('/skills/stats'),
    fetchJSON('/hourly'),
    fetchJSON('/requests/recent'),
  ]);
  if (overview) renderCards(overview);
  if (timeline) updateTrend(timeline);
  if (users) updateUsers(users);
  if (skills) updateSkills(skills);
  if (hourly) updateHourly(hourly);
  if (recent) renderRecent(recent);
  document.getElementById('updateTime').textContent =
    'Updated ' + new Date().toLocaleTimeString('zh-CN');
}

initCharts();
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
